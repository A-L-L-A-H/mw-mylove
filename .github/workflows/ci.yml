name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional
      - name: Run commitlint
        run: npx commitlint --from=origin/main --to=HEAD --extends @commitlint/config-conventional

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: mw-mylove
      - name: Check out shared design system
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: A-L-L-A-H/mw-design
          ref: fb3b75cbb64d8a4ef3d148bd1133d48e083a8950
          path: mw-design
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: mw-mylove
      - name: Lint
        run: bun run lint -- --max-warnings 0
        working-directory: mw-mylove
      - name: Format check
        run: bun run format:check
        working-directory: mw-mylove
      - name: Typecheck
        run: bun run typecheck
        working-directory: mw-mylove
      - name: Test
        run: bun test
        working-directory: mw-mylove
      - name: Build
        run: bun run build
        working-directory: mw-mylove

  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        with:
          version: 8.30.1
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: bun audit
        run: bun audit --audit-level high
